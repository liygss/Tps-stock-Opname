function xlItems(){dl('data-barang.xlsx',xlsx('Data Barang','DATA BARANG — PT TERMINAL PETIKEMAS SURABAYA','Dicetak: '+new Date().toLocaleString('id-ID')+' · '+S.items.length+' barang',['No','Kode Barang','Kode Akun','Nama Barang','Kategori','Satuan','Gudang','Lokasi'],[7,16,16,36,18,12,24,18],'cccllccl',S.items.map((i,n)=>[n+1,i.kode,i.akun||'',i.nama,i.kat||'',i.satuan,i.gudang||'',i.lokasi||''])))}
const NAV=[['items','Data Barang'],['so','Stock Opname']];
function go(p){if(p){page=p;sel=null;cur={};pf=null}
 $('#app').innerHTML=`<aside class="${off?'off':''}"><div class="brand"><svg width="30" height="30" viewBox="0 0 34 34"><rect width="34" height="34" rx="7" fill="#8B2635"/><path d="M6 24h22l-3 4H9zM9 14h6v8H9zm7 0h6v8h-6zM23 8v14" stroke="#fff" stroke-width="2" fill="none"/></svg><div>Stock Opname<small>Inventory System · PT TPS</small></div><button class="x" title="Tutup menu" aria-label="Tutup menu" onclick="off=true;document.querySelector('aside').classList.add('off')">✕</button></div>${NAV.map(n=>`<a class="${n[0]==page?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}</aside><main><header><button class="s" onclick="off=!off;document.querySelector('aside').classList.toggle('off')">☰</button><img class="logo" src="${LOGO}" alt="Pelindo TPS Surabaya"><h2>${NAV.find(n=>n[0]==page)[1]}</h2></header><div class="wrap">${page=='items'?items():so()}</div></main>`}
const fld=(l,id,v='',t='text',x='')=>`<div><label>${l}</label><input id="${id}" type="${t}" value="${E(v)}" ${x}></div>`;
function tbl(h,rows){return`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')||`<tr><td colspan="${h.length}" class="empty">Belum ada data</td></tr>`}</table></div>`}
function items(){if(sel!==null){const it=itm(sel)||{},nw=sel==='';
 return`<div class="card"><div class="ch"><h3>${nw?'Tambah Barang':'Ubah Barang'}</h3><button class="x" title="Kembali" aria-label="Kembali" onclick="sel=null;go()">✕</button></div><div class="form">${fld('Kode Barang (unik)','i_kode',it.kode,'text',nw?'onchange="dupChk()"':'readonly')}${fld('Kode Akun','i_akun',it.akun)}${fld('Nama Barang','i_nama',it.nama)}${fld('Kategori','i_kat',it.kat)}${fld('Satuan','i_sat',it.satuan,'text','placeholder="pcs, kg, unit…"')}${fld('Gudang','i_gd',it.gudang)}${fld('Lokasi Penyimpanan','i_lok',it.lokasi)}</div><div class="bar" style="margin-top:14px"><button onclick="saveItem(${nw})">Simpan</button><button class="s" onclick="sel=null;go()">Batal</button>${nw?'':`<button class="d" onclick="delItem()">Hapus</button>`}</div></div>`}
 const L=S.items.filter(i=>!q||(i.kode+i.nama).toLowerCase().includes(q.toLowerCase()));
 return`<div class="card"><div class="bar"><input id="q" placeholder="Cari kode / nama barang" value="${E(q)}" oninput="q=this.value;go();let e=$('#q');e.focus();e.setSelectionRange(99,99)"><button onclick="sel='';go()">+ Tambah Barang</button><button class="s" onclick="impOpen()">Impor</button><button class="g" onclick="expMenu('items')">Ekspor</button></div>${tbl(['Kode','Kode Akun','Nama Barang','Kategori','Satuan','Gudang','Lokasi',''],L.map(i=>`<tr><td>${E(i.kode)}</td><td>${E(i.akun)}</td><td>${E(i.nama)}</td><td>${E(i.kat)}</td><td>${E(i.satuan)}</td><td>${E(i.gudang)}</td><td>${E(i.lokasi)}</td><td><button class="s" onclick="sel='${E(i.kode)}';go()">Ubah</button></td></tr>`))}<p class="hint">Impor menerima file Excel (.xlsx/.xls) atau CSV. Kolom: Kode Barang, Kode Akun, Nama Barang, Kategori, Satuan, Gudang, Lokasi. File hasil Ekspor bisa langsung diimpor kembali.</p></div>`}
function dupChk(){const k=V('i_kode').trim(),e=itm(k);if(e&&confirm('Kode barang '+k+' sudah ada ('+e.nama+').\nBuka barang tersebut untuk diedit?')){sel=k;go()}}
function saveItem(nw){const g=k=>V('i_'+k).trim(),kode=g('kode');if(!kode||!g('nama')||!g('sat'))return toast('Kode, nama, dan satuan wajib diisi');if(nw&&itm(kode)){dupChk();return}
 save('items',{id:nw?kode:itm(kode).id,kode,akun:g('akun'),nama:g('nama'),kat:g('kat'),satuan:g('sat'),gudang:g('gd'),lokasi:g('lok'),upd:new Date().toISOString()});toast('Barang tersimpan');sel=null;go()}
function delItem(){if(S.so.some(s=>s.kode==sel))return toast('Tidak dapat dihapus: barang sudah dipakai di Stock Opname');if(confirm('Hapus barang '+sel+'?')){del('items',itm(sel).id);sel=null;go()}}
/* ===== Modal, pemuat library, PDF, Impor ===== */
function closeM(){const m=$('#mdl');if(m)m.remove()}
function modal(t,body){closeM();const d=document.createElement('div');d.id='mdl';d.className='mdl';d.onmousedown=e=>{if(e.target==d)closeM()};d.innerHTML=`<div class="mbox"><div class="mh"><h3>${t}</h3><button class="x" title="Tutup" aria-label="Tutup" onclick="closeM()">✕</button></div>${body}</div>`;document.body.appendChild(d)}
addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
const lib=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error(u));document.head.appendChild(e)});
const CDN='https://cdnjs.cloudflare.com/ajax/libs/';
async function needXLSX(){if(!window.XLSX)await lib(CDN+'xlsx/0.18.5/xlsx.full.min.js')}
async function needPDF(){if(!window.jspdf)await lib(CDN+'jspdf/2.5.1/jspdf.umd.min.js');if(!(window.jspdf&&window.jspdf.jsPDF.API.autoTable))await lib(CDN+'jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js')}
function expMenu(k){modal('Pilih Format Export',`<p class="hint">Pilih format file untuk ${k=='so'?'data Stock Opname':'Data Barang'}.</p><div class="bar" style="margin-top:12px"><button class="g" onclick="doExp('${k}','x')">Export Excel (.xlsx)</button><button class="d" onclick="doExp('${k}','p')">Export PDF</button><button class="s" onclick="closeM()">Batal</button></div>`)}
function doExp(k,f){closeM();k=='so'?(f=='x'?xlSO():pdfSO()):(f=='x'?xlItems():pdfItems())}
async function pdf(name,title,sub,H,rows,cs){try{await needPDF()}catch(e){return toast('Library PDF gagal dimuat. Periksa koneksi internet.')}
 const d=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
 d.setFontSize(14);d.setFont(undefined,'bold');d.text(title,40,38);d.setFont(undefined,'normal');d.setFontSize(9);d.setTextColor(100);d.text(sub,40,54);
 d.autoTable({head:[H],body:rows.length?rows:[[{content:'Belum ada data',colSpan:H.length,styles:{halign:'center'}}]],startY:66,margin:{left:40,right:40,bottom:36},styles:{fontSize:8,cellPadding:4,valign:'middle',lineColor:[217,226,243],lineWidth:.5},headStyles:{fillColor:[20,43,74],textColor:255,halign:'center'},alternateRowStyles:{fillColor:[243,247,251]},columnStyles:cs||{}});
 const n=d.getNumberOfPages(),w=d.internal.pageSize.getWidth(),h=d.internal.pageSize.getHeight();
 for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.setTextColor(120);d.text('Halaman '+i+' dari '+n,w-40,h-18,{align:'right'})}
 dl(name,d.output('blob'),'PDF diekspor')}
function pdfSO(){const L=[...S.so].sort((a,b)=>a.tgl.localeCompare(b.tgl));
 pdf('stock-opname.pdf','TEMPLATE STOCK OPNAME — PT TERMINAL PETIKEMAS SURABAYA','Hasil pemeriksaan fisik persediaan · Dicetak: '+new Date().toLocaleString('id-ID')+' · '+L.length+' data',['Nomor','Tanggal','Kode Akun','Gudang','Kode','Nama Barang','Fisik','Satuan','Foto'],
 L.map((s,i)=>[i+1,new Date(s.tgl).toLocaleDateString('id-ID'),s.akun||itm(s.kode)?.akun||'',s.gudang||'',s.kode,s.nama,s.fisik,s.satuan,s.foto?'Ada':'-']),{0:{halign:'center',cellWidth:40},1:{halign:'center'},6:{halign:'center'},7:{halign:'center'},8:{halign:'center',cellWidth:40}})}
function pdfItems(){pdf('data-barang.pdf','DATA BARANG — PT TERMINAL PETIKEMAS SURABAYA','Dicetak: '+new Date().toLocaleString('id-ID')+' · '+S.items.length+' barang',['No','Kode Barang','Kode Akun','Nama Barang','Kategori','Satuan','Gudang','Lokasi'],
 S.items.map((i,n)=>[n+1,i.kode,i.akun||'',i.nama,i.kat||'',i.satuan||'',i.gudang||'',i.lokasi||'']),{0:{halign:'center',cellWidth:32},5:{halign:'center'}})}
const IH=['No','Kode Barang','Kode Akun','Nama Barang','Kategori','Satuan','Gudang','Lokasi'];
function tplItems(){dl('template-impor-data-barang.xlsx',xlsx('Data Barang','TEMPLATE IMPOR DATA BARANG','Isi data mulai baris 5. Wajib: Kode Barang, Nama Barang, Satuan. Kolom No boleh dikosongkan.',IH,[7,16,16,36,18,12,24,18],'cccllccl',[]),'Template diunduh')}
const NK={kode:['kode','kodebarang'],akun:['akun','kodeakun'],nama:['nama','namabarang'],kat:['kat','kategori'],satuan:['satuan','sat'],gudang:['gudang'],lokasi:['lokasi','lokasipenyimpanan']};
const nk=v=>{const x=String(v??'').toLowerCase().replace(/[^a-z]/g,'');for(const k in NK)if(NK[k].includes(x))return k;return null};
function csvRows(t){t=t.replace(/^﻿/,'');const f=t.split(/\r?\n/,1)[0],dl_=[',',';','\t'].map(d=>[d,f.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0],R=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==dl_){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=ch}
 if(c!==''||r.length){r.push(c);R.push(r)}return R}
let IMP=null;
function impOpen(){IMP=null;modal('Impor Data Barang',`<p class="hint">Pilih file Excel (.xlsx / .xls) atau CSV. Baris judul di atas tabel akan dilewati otomatis.</p><div class="bar"><input id="impf" type="file" accept=".xlsx,.xls,.csv" onchange="impRead(this.files[0])"><button class="s" onclick="tplItems()">Unduh Template Excel</button></div><label style="display:flex;gap:8px;align-items:center;font-weight:500;margin:6px 0"><input id="impo" type="checkbox" style="padding:0" onchange="impPrev()"> Timpa barang yang kodenya sudah ada (jika tidak dicentang, dilewati)</label><div id="impv"></div>`)}
async function impRead(f){if(!f)return;const v=$('#impv');v.innerHTML='<p class="hint">Membaca file…</p>';let rows;
 try{if(/\.csv$/i.test(f.name))rows=csvRows(await f.text());else{await needXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}}
 catch(e){v.innerHTML='<p class="hint" style="color:var(--mar)">Gagal membaca file. Untuk Excel dibutuhkan koneksi internet (atau gunakan CSV).</p>';return}
 const hi=rows.findIndex(r=>{const m=r.map(nk);return m.includes('kode')&&m.includes('nama')});
 if(hi<0){v.innerHTML='<p class="hint" style="color:var(--mar)">Header tidak ditemukan. Pastikan ada kolom <b>Kode Barang</b> dan <b>Nama Barang</b>.</p>';return}
 const m=rows[hi].map(nk),seen=new Set();IMP=[];
 for(const r of rows.slice(hi+1)){if(!r.some(x=>String(x).trim()))continue;const o={};m.forEach((k,i)=>{if(k&&o[k]===undefined)o[k]=String(r[i]??'').trim()});
  let st='n',msg='';if(!o.kode)(st='e',msg='Kode kosong');else if(!o.nama)(st='e',msg='Nama kosong');else if(!o.satuan)(st='e',msg='Satuan kosong');else if(seen.has(o.kode))(st='e',msg='Kode ganda di file');else{seen.add(o.kode);if(itm(o.kode))st='u'}
  IMP.push({o,st,msg})}
 impPrev()}
function impPrev(){const v=$('#impv');if(!v||!IMP)return;const ow=$('#impo')?.checked,c={n:0,u:0,e:0};IMP.forEach(x=>c[x.st]++);const ok=c.n+(ow?c.u:0);
 v.innerHTML=`<div class="bar" style="margin-top:8px"><span class="chip n">${c.n} baru</span><span class="chip u">${c.u} sudah ada ${ow?'(ditimpa)':'(dilewati)'}</span><span class="chip e">${c.e} error</span></div><div class="tw" style="max-height:38vh;overflow:auto">${tbl(['Status','Kode','Nama','Satuan','Keterangan'],IMP.slice(0,100).map(x=>`<tr><td><span class="chip ${x.st}">${x.st=='n'?'Baru':x.st=='u'?(ow?'Timpa':'Lewati'):'Error'}</span></td><td>${E(x.o.kode)}</td><td>${E(x.o.nama)}</td><td>${E(x.o.satuan)}</td><td>${E(x.msg)}</td></tr>`))}</div>${IMP.length>100?`<p class="hint">Menampilkan 100 dari ${IMP.length} baris.</p>`:''}<div class="bar" style="margin-top:12px"><button ${ok?'':'disabled'} onclick="impGo()">Impor ${ok} barang</button><button class="s" onclick="closeM()">Batal</button></div>`}
async function impGo(){const ow=$('#impo')?.checked,now=new Date().toISOString();let n=0,u=0,sk=0,er=0;const jobs=[];
 for(const x of IMP){if(x.st=='e'){er++;continue}const ex=itm(x.o.kode);if(ex&&!ow){sk++;continue}
  const o={id:ex?ex.id:x.o.kode,kode:x.o.kode,akun:x.o.akun||'',nama:x.o.nama,kat:x.o.kat||'',satuan:x.o.satuan,gudang:x.o.gudang||'',lokasi:x.o.lokasi||'',upd:now};
  const i=S.items.findIndex(z=>z.id==o.id);i<0?S.items.push(o):S.items[i]=o;ex?u++:n++;if(DB)jobs.push(DB.collection('items').doc(o.id).set(o))}
 let fail=0;if(jobs.length)fail=(await Promise.allSettled(jobs)).filter(r=>r.status=='rejected').length;
 closeM();go();toast(n+' barang baru, '+u+' diperbarui'+(sk?', '+sk+' dilewati':'')+(er?', '+er+' error':'')+(fail?'. '+fail+' gagal disimpan ke database':''))}
function so(){const c=cur,L=S.so.filter(s=>!qs||(s.kode+s.nama+s.no).toLowerCase().includes(qs.toLowerCase())).sort((a,b)=>b.tgl.localeCompare(a.tgl)),gd=[...new Set(S.items.map(i=>i.gudang).filter(Boolean))];
 const no=c.no||'SO-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+String(S.so.length+1).padStart(3,'0');
 return`<div class="card"><div class="ch"><h3>${c.id?'Ubah':'Form'} Stock Opname</h3>${c.id?`<button class="x" title="Kembali" aria-label="Kembali" onclick="cur={};pf=null;go()">✕</button>`:''}</div><div class="form">${fld('Nomor Stock Opname','s_no',no)}${fld('Tanggal & Waktu','s_tgl',c.tgl||nowL(),'datetime-local')}${fld('Kode Akun (otomatis dari Data Barang)','s_akun',c.akun,'text','readonly')}<div><label>Gudang</label><input id="s_gd" list="gl" value="${E(c.gudang)}"><datalist id="gl">${gd.map(g=>`<option value="${E(g)}">`).join('')}</datalist></div><div><label>Kode Barang</label><input id="s_kode" list="kl" value="${E(c.kode)}" onchange="fill()" placeholder="Ketik / pilih kode"><datalist id="kl">${S.items.map(i=>`<option value="${E(i.kode)}">${E(i.nama)}</option>`).join('')}</datalist></div>${fld('Nama Barang','s_nama',c.nama,'text','readonly')}${fld('Satuan','s_sat',c.satuan,'text','readonly')}${fld('Stok Fisik','s_fisik',c.fisik,'number','min="0" step="any"')}<div><label>Foto Fisik Barang</label><input id="s_foto" type="file" accept="image/jpeg,image/png,image/webp" onchange="pv(this.files[0])"><img id="pv" src="${E(c.foto)}" style="margin-top:8px;max-height:130px;border-radius:6px;display:${c.foto?'block':'none'}"></div></div><div class="bar" style="margin-top:14px"><button onclick="saveSO()">Simpan</button><button class="s" onclick="cur={};pf=null;go()">Baru / Batal</button></div></div>
 <div class="card"><div class="bar"><input id="qs" placeholder="Cari nomor / kode / nama" value="${E(qs)}" oninput="qs=this.value;go();let e=$('#qs');e.focus();e.setSelectionRange(99,99)"><button class="g" onclick="expMenu('so')">Export</button></div>${tbl(['Nomor','Tanggal','Kode Akun','Gudang','Kode','Nama Barang','Fisik','Satuan','Foto',''],L.map(s=>`<tr><td>${E(s.no)}</td><td>${fmt(s.tgl)}</td><td>${E(s.akun||itm(s.kode)?.akun)}</td><td>${E(s.gudang)}</td><td>${E(s.kode)}</td><td>${E(s.nama)}</td><td><b>${E(s.fisik)}</b></td><td>${E(s.satuan)}</td><td>${s.foto?`<a href="${E(s.foto)}" target="_blank"><img class="thumb" src="${E(s.foto)}"></a>`:'-'}</td><td style="white-space:nowrap"><button class="s" onclick="cur=S.so.find(x=>x.id=='${s.id}');pf=null;go();scrollTo(0,0)">Ubah</button> <button class="d" onclick="delSO('${s.id}')">Hapus</button></td></tr>`))}</div>`}
function fill(){const it=itm(V('s_kode').trim());$('#s_nama').value=it?.nama||'';$('#s_sat').value=it?.satuan||'';$('#s_akun').value=it?.akun||'';if(it?.gudang&&!V('s_gd'))$('#s_gd').value=it.gudang;if(!it&&V('s_kode'))toast('Kode barang tidak terdaftar di Data Barang')}
function pv(f){pf=f;const i=$('#pv');if(f){i.src=URL.createObjectURL(f);i.style.display='block'}}
async function saveSO(){const kode=V('s_kode').trim(),it=itm(kode),no=V('s_no').trim(),fs=V('s_fisik');
 if(!it)return toast('Pilih kode barang yang terdaftar di Data Barang');if(!V('s_gd').trim())return toast('Gudang wajib diisi');if(fs===''||Number(fs)<0)return toast('Isi stok fisik dengan benar');
 if(S.so.some(s=>s.no==no&&s.id!=cur.id))return toast('Nomor Stock Opname sudah dipakai');
 let foto=cur.foto||'',fotoId=cur.fotoId||'';
 if(pf){if(!/^image\/(jpeg|png|webp)$/.test(pf.type))return toast('Foto harus JPG, PNG, atau WEBP');if(pf.size>10*1048576)return toast('Foto maksimal 10 MB');if(!AS)return toast('Penyimpanan foto tidak tersedia di tampilan ini');
  try{const r=await AS.upload(pf);foto=r.url;fotoId=r.id}catch(e){return toast('Upload foto gagal')}}
 await save('so',{id:cur.id||uid(),no,tgl:new Date(V('s_tgl')).toISOString(),akun:V('s_akun').trim(),gudang:V('s_gd').trim(),kode,nama:it.nama,satuan:it.satuan,fisik:Number(fs),foto,fotoId});toast('Stock opname tersimpan');cur={};pf=null;go()}
async function delSO(id){const s=S.so.find(x=>x.id==id);if(!confirm('Hapus '+s.no+'?'))return;if(s.fotoId&&AS)try{await AS.delete(s.fotoId)}catch(e){}del('so',id)}
boot();
</script></body></html>
